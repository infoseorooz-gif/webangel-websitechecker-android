name: Build Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/webangel-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/webangel-upload-key.jks"

      - name: Build unsigned Release APK and AAB
        run: |
          gradle clean :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Locate build outputs
        id: locate
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$APK" || (echo "Release APK not found" && exit 1)
          test -n "$AAB" || (echo "Release AAB not found" && exit 1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -v 4 "${{ steps.locate.outputs.apk }}" release/WebAngel-SEO-Analyzer-1.0.0-aligned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/webangel-upload-key.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out release/WebAngel-SEO-Analyzer-1.0.0-release.apk \
            release/WebAngel-SEO-Analyzer-1.0.0-aligned.apk
          rm release/WebAngel-SEO-Analyzer-1.0.0-aligned.apk

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cp "${{ steps.locate.outputs.aab }}" release/WebAngel-SEO-Analyzer-1.0.0-release.aab
          jarsigner \
            -keystore "$RUNNER_TEMP/webangel-upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            release/WebAngel-SEO-Analyzer-1.0.0-release.aab \
            "$KEY_ALIAS"

      - name: Verify signed outputs
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/WebAngel-SEO-Analyzer-1.0.0-release.apk
          jarsigner -verify -strict release/WebAngel-SEO-Analyzer-1.0.0-release.aab

      - name: Create checksums
        run: |
          cd release
          sha256sum WebAngel-SEO-Analyzer-1.0.0-release.apk WebAngel-SEO-Analyzer-1.0.0-release.aab > SHA256SUMS.txt

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: webangel-seo-analyzer-1.0.0-signed-release
          path: |
            release/WebAngel-SEO-Analyzer-1.0.0-release.apk
            release/WebAngel-SEO-Analyzer-1.0.0-release.aab
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
